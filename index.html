<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天跑不跑？</title>
<style>
:root{--ink:#191914;--paper:#f6efdf;--red:#ff5733;--blue:#5874ff;--acid:#dcff18;--muted:#756f64}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 15%,#ff573329,transparent 28%),radial-gradient(circle at 85% 85%,#5874ff29,transparent 30%),var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.page{width:min(1050px,calc(100% - 32px));min-height:100vh;margin:auto;display:grid;grid-template-rows:auto 1fr auto;position:relative}header,footer{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:2px solid;font-size:12px;font-weight:900;letter-spacing:.13em}.brand{display:flex;gap:10px;align-items:center}.dot{width:13px;height:13px;border-radius:50%;background:var(--red);box-shadow:8px 0 var(--acid)}.date,footer{color:var(--muted)}main{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:clamp(35px,7vw,90px);padding:55px 0}.tag{display:inline-block;margin:0 0 19px;padding:7px 10px;border:2px solid;background:var(--acid);font-size:12px;font-weight:900;transform:rotate(-2deg);box-shadow:3px 3px var(--ink)}h1{margin:0;font-size:clamp(64px,10vw,128px);font-weight:950;line-height:.84;letter-spacing:-.09em}h1 span{color:var(--red)}.intro{max-width:380px;margin:29px 0 30px;color:var(--muted);font-size:15px;line-height:1.8}button{position:relative;width:min(360px,100%);border:0;border-radius:50px;padding:23px 28px;background:var(--ink);color:#fff;font:900 20px/1 inherit;cursor:pointer;box-shadow:0 9px var(--red);transition:.15s}button:after{content:"→";position:absolute;right:27px;font-size:26px;top:18px}button:hover{transform:translateY(-3px);box-shadow:0 12px var(--red)}button:active{transform:translateY(7px);box-shadow:0 2px var(--red)}button:disabled{cursor:wait}.card{min-height:520px;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:clamp(28px,5vw,58px);border:2px solid;border-radius:4px;background:#ffffff80;box-shadow:14px 14px var(--ink)}.card:before{content:"";position:absolute;width:190px;height:190px;right:-75px;top:-75px;border:34px solid var(--acid);border-radius:50%}.label{color:var(--muted);font:800 12px/1 monospace;letter-spacing:.15em}.result{min-height:125px;margin:23px 0 27px;display:flex;align-items:center;font-size:clamp(86px,15vw,150px);font-weight:950;line-height:.8;letter-spacing:-.08em}.run{color:var(--red)}.rest{color:var(--blue);font-size:clamp(72px,12vw,120px)}.thinking{color:var(--muted);animation:blink .22s steps(2) infinite}.reason{min-height:150px;margin:0;padding-top:22px;border-top:2px solid;font-size:15px;line-height:1.9}.stamp{position:absolute;right:28px;bottom:20px;padding:6px 10px;border:2px solid;border-radius:3px;font-size:11px;font-weight:900;letter-spacing:.12em;transform:rotate(-7deg);opacity:0}.stamp.show{opacity:.7;animation:stamp .35s cubic-bezier(.2,1.7,.4,1)}footer{border:0;border-top:2px solid}.count b{color:var(--ink)}@keyframes blink{50%{opacity:.25}}@keyframes pop{0%{transform:scale(.5) rotate(-4deg);opacity:0}70%{transform:scale(1.06)}}@keyframes stamp{from{transform:rotate(-7deg) scale(2.5);opacity:0}}.reveal{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@media(max-width:760px){main{grid-template-columns:1fr;padding:38px 0 50px}h1{font-size:clamp(70px,25vw,112px)}button{width:100%}.card{min-height:450px;box-shadow:9px 9px var(--ink)}.result{font-size:clamp(90px,36vw,140px)}.result.rest{font-size:clamp(72px,29vw,112px)}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body><div class="page">
<header><div class="brand"><i class="dot"></i>今日运动决策所</div><div class="date" id="date"></div></header>
<main><section><p class="tag">拒绝独立思考 · 交给命运</p><h1>今天<br><span>跑不跑</span>？</h1><p class="intro">如果你已经换好衣服，那就更该问一下。如果你还躺着，那也完全不影响命运替你做决定。</p><button id="decide">今天跑不跑</button></section>
<section class="card" aria-live="polite"><div class="label">TODAY'S VERY SERIOUS VERDICT</div><div class="result" id="result">？</div><p class="reason" id="reason">点击按钮，获取一个毫无科学依据、但语气十分笃定的答案。</p><div class="stamp" id="stamp">命运已盖章</div></section></main>
<footer><span class="count">命运今日已被打扰 <b id="count">0</b> 次</span><span>结果仅供参考 · 身体不适请休息</span></footer></div>
<script>
const $=s=>document.querySelector(s),btn=$('#decide'),result=$('#result'),reason=$('#reason'),stamp=$('#stamp'),counter=$('#count');let count=0;
$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'}).format(new Date());
const common=['毕竟天气看起来就很像一种天气','刚才那阵风明显有自己的想法','鞋带到现在也没有表示反对','楼下那只猫看了你一眼，应该是在暗示什么','冰箱里的酸奶保质期已经进入关键阶段','今天的云排列得颇有深意','手机电量这个数字很有象征意义','隔壁关门的声音十分坚定','宇宙虽然没回消息，但大概已经默认了','事情都走到打开这个网页这一步了','拖延五分钟和思考人生的区别本来就不大','你的运动手表最近多少有点寂寞','今天袜子的左右脚配合得异常默契','从概率学的角度来说，总得有个结果','不管做什么，晚饭都还是会到来','朋友圈里总有人比你更自律，也总有人没有','刚闪过的第一个念头通常不负责任但很响亮','总不能让买来的装备只负责占地方','地球已经自转这么久，也不差你这一圈','专家没有这么说，但听起来很像专家说的'];
const yes=['跑。主要是因为你问了，说明心里多少还是想去的','跑。不是为了配速，是为了回来洗澡时获得一种虚假的重启感','跑。哪怕只跑到楼下再绕回来，也算给今天一个交代','跑。腿可以慢，歌单不能白建，运动软件也该偶尔解除休眠','跑。今天适合制造一点“我居然真的出门了”的震惊','跑。先出去十分钟，十分钟后回来也算战略性完成','跑。沙发已经充分体验过你了，轮到马路了','跑。速度不重要，重要的是让晚饭显得更理直气壮'];
const no=['不跑。今天适合保存体力，毕竟明天也可能继续纠结','不跑。你的意志已经完成了一次高强度心理折返跑','不跑。休息不是偷懒，是把计划暂存到更有希望的时间点','不跑。今天的核心训练是躺平时保持呼吸均匀','不跑。鞋可以放一天假，脚也没有提交加班申请','不跑。散个步，然后对外宣称这是主动恢复','不跑。今天先和被子建立稳定的合作关系','不跑。保存膝盖的新鲜度，为下一次突然自律做准备'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function chatter(run){let pool=[...common],bits=[];for(let i=0,n=5+Math.floor(Math.random()*4);i<n;i++)bits.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);return `${pick(run?yes:no)}。${bits.join('，')}。${run?'所以别再研究了，穿鞋，出门，慢慢跑也算跑。':'综上，今天就心安理得地不跑，最多出去走两步意思一下。'}`}
btn.onclick=()=>{btn.disabled=true;stamp.classList.remove('show');result.className='result thinking';result.textContent='……';reason.textContent='正在综合分析空气湿度、袜子松紧、楼下路况、晚饭热量以及你不想承认的真实想法……';setTimeout(()=>{let run=Math.random()<.5;result.textContent=run?'跑':'不跑';result.className=`result ${run?'run':'rest'} reveal`;reason.textContent=chatter(run);stamp.style.color=run?'var(--red)':'var(--blue)';stamp.classList.add('show');counter.textContent=++count;btn.textContent='不服？再问一次';btn.disabled=false},720)};
</script></body></html>
